# Keine Custom Cards erforderlich: nur HA-Core (picture-elements, entities, vertical-stack).
# Einschränkung: HA-Core kann fan.percentage nicht in "Level 1-3" umrechnen; es wird Prozent gezeigt.
# Entity-IDs sind als YAML-Anker oben gesammelt; nur diese Werte anpassen.
type: vertical-stack
x-entity-humidity: &humidity sensor.comfoair_q_inside_humidity
x-entity-co2: &co2 sensor.wohnzimmer_co2
x-entity-fan: &fan fan.comfoair_q
x-entity-vent-mode: &vent_mode select.comfoair_q_ventilation_mode
x-entity-outside-temp: &outside_temp sensor.comfoair_q_outside_temperature
x-entity-supply-temp: &supply_temp sensor.comfoair_q_supply_temperature
x-entity-inside-temp: &inside_temp sensor.comfoair_q_inside_temperature
x-entity-exhaust-temp: &exhaust_temp sensor.comfoair_q_exhaust_temperature
x-entity-bypass: &bypass select.comfoair_q_bypass_mode
x-entity-filter-days: &filter_days sensor.comfoair_q_days_to_replace_filter
x-entity-boost: &boost select.comfoair_q_boost_mode
x-entity-fault: &fault binary_sensor.luftung_storung
cards:
  - type: picture-elements
    image: >-
      data:image/svg+xml;base64,
    elements:
      - {type: state-label, entity: *humidity, prefix: "Feuchte ", style: {left: 16%, top: 8%, color: white}}
      - {type: state-label, entity: *co2, prefix: "CO₂ ", style: {left: 50%, top: 8%, color: white}}
      - {type: state-label, entity: *fan, attribute: percentage, suffix: "%", prefix: "Lüfter ", style: {left: 84%, top: 8%, color: white}}
      - {type: state-label, entity: *vent_mode, style: {left: 10%, top: 22%, color: white}, tap_action: {action: more-info}}
      - {type: state-label, entity: *outside_temp, prefix: "Außen ", style: {left: 20%, top: 43%, color: "#3498db"}}
      - {type: state-label, entity: *supply_temp, prefix: "Zuluft ", style: {left: 80%, top: 43%, color: "#e74c3c"}}
      - {type: icon, icon: mdi:heat-exchanger, style: {left: 50%, top: 59%, color: white}}
      - {type: state-label, entity: *inside_temp, prefix: "Abluft ", style: {left: 20%, top: 70%, color: "#e74c3c"}}
      - {type: state-label, entity: *exhaust_temp, prefix: "Fortluft ", style: {left: 80%, top: 70%, color: "#3498db"}}
  - type: entities
    title: ComfoAir Q
    show_header_toggle: false
    entities:
      - {entity: *bypass, name: Bypass}
      - {entity: *filter_days, name: Filter-Restlaufzeit}
      - {entity: *boost, name: Boost, tap_action: {action: more-info}}
      - {entity: *fault, name: Lüftungsstörung}

